<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro / M P2 Concept</title>
<style>
:root{--bg:#e7e8e6;--ink:#22272b;--muted:#5d666d;--panel:#ffffffe6;--accent:#355b88;--line:#b9bfc4}
@media (prefers-color-scheme:dark){:root{--bg:#1d2023;--ink:#e6e8ea;--muted:#a3abb2;--panel:#26292ce6;--accent:#6f9fd6;--line:#454b50}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;left:16px;top:14px;right:16px;pointer-events:none}
header>*{pointer-events:auto}
h1{margin:0;font-size:20px;letter-spacing:.04em}
.sub{color:var(--muted);margin:2px 0 8px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
button{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:6px 11px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#info{position:absolute;left:16px;bottom:14px;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
#info b{font-weight:600}
#pick{color:var(--muted);margin-top:4px;min-height:1.2em}
@media (max-width:600px){#info{right:16px;max-width:none}}
</style></head>
<body>
<canvas id="c" aria-label="Interactive CAD concept"></canvas>
<header>
  <h1>RETRO / M — P2 concept</h1>
  <div class="sub">Kaypro-style luggable · drag to orbit, right-drag to pan, scroll to zoom, click a part for its note</div>
  <nav id="states"></nav>
  <nav id="pals"></nav>
</header>
<div id="info"><div id="dims"></div><div id="pick">Click a part to identify it.</div></div>
<script>__THREE__</script>
<script>__ORBIT__</script>
<script>__ROOM__</script>
<script>
'use strict';
const S=__SCENE__;
THREE.ColorManagement.legacyMode=false;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
scene.background=new THREE.Color(dark?0x1d2023:0xe7e8e6);
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(30,1,5,8000);camera.up.set(0,0,1);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const sun=new THREE.DirectionalLight(0xffffff,1.25);sun.position.set(-500,-700,1100);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-700,right:700,top:700,bottom:-700,near:100,far:3000});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.6;
sun.target.position.set(200,0,0);scene.add(sun,sun.target,new THREE.HemisphereLight(0xffffff,0x8a8f94,0.35));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.ShadowMaterial({opacity:dark?0.45:0.22}));ground.receiveShadow=true;ground.position.set(200,0,-0.01);scene.add(ground);

const mats={};
function mat(role){if(mats[role])return mats[role];
  const metal=role==='metal',glass=role==='glass';
  const m=new THREE.MeshStandardMaterial({color:0x888888,roughness:metal?0.35:glass?0.12:0.62,metalness:metal?0.7:0.0,side:THREE.DoubleSide});
  return mats[role]=m;}
const lineMat=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.22});
const objs=[];
for(const p of S.parts){
  let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p.v,3));g.setIndex(p.f);
  g=g.toNonIndexed();g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,mat(p.role));mesh.castShadow=true;mesh.receiveShadow=true;mesh.matrixAutoUpdate=false;mesh.userData=p;
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(g,28),lineMat);mesh.add(edges);
  scene.add(mesh);objs.push(mesh);p.v=null;p.f=null;}
// Illustrative screen image (green phosphor), not CAD.
// Screen: the RetroOS Phosphor BIOS POST screen (tools/render_post_screen.py), embedded as a PNG.
const A=S.active,cw=1920,ch=1200,POST='__POST__';
const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const x=cv.getContext('2d');x.fillStyle='#0A0A0F';x.fillRect(0,0,cw,ch);
const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;let screenReady=false;
const img=new Image();img.onload=()=>{x.drawImage(img,0,0,cw,ch);tex.needsUpdate=true;screenReady=true;};img.onerror=()=>{screenReady=true;};img.src=POST;
const screen=new THREE.Mesh(new THREE.PlaneGeometry(A[2]-A[0],A[3]-A[1]),new THREE.MeshBasicMaterial({map:tex,toneMapped:false}));
screen.rotation.x=Math.PI/2;screen.position.set((A[0]+A[2])/2,S.glass_y-0.08,(A[1]+A[3])/2);screen.updateMatrix();const screenBase=screen.matrix.clone();screen.matrixAutoUpdate=false;scene.add(screen);

// States with tweened rigid transforms.
const cur={},from={},to={};let t0=0,dur=0;
function M(a){const m=new THREE.Matrix4();m.set(...a);return m;}
function target(state){const st=S.states[state];const r={};for(const k in st)r[k]=M(st[k]);return r;}
function applyAll(){const W=cur._world||new THREE.Matrix4();
  for(const o of objs){const k=o.userData.state;o.matrix.copy(W);if(k&&cur[k])o.matrix.multiply(cur[k]);o.matrixWorldNeedsUpdate=true;}
  screen.matrix.copy(W).multiply(screenBase);screen.matrixWorldNeedsUpdate=true;}
function decomp(m){const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();m.decompose(p,q,s);return{p,q};}
let xray=false,curState='operating',curPal='charcoal';
function setState(name,instant){
  const real=name==='xray'?'operating':name;xray=name==='xray';curState=name;
  const tg=target(real);for(const k in tg){from[k]=decomp(cur[k]||tg[k]);to[k]=decomp(tg[k]);}
  t0=performance.now();dur=instant?0:900;tick(instant?1:0);
  for(const o of objs){const g=o.userData.group,n=o.userData.name;const ghost=xray&&(n==='shell'||n==='rear_panel'||n==='fascia'||n==='shield_frame'||n==='legend_plate'||n==='side_stripes'||n==='brand_side');
    o.material=ghost?ghostMat(o.userData.role):mat(o.userData.role);o.castShadow=!ghost;o.children[0].visible=!ghost;}
  document.querySelectorAll('#states button').forEach(b=>b.classList.toggle('on',b.dataset.k===name));
}
const ghosts={};function ghostMat(role){return ghosts[role]||(ghosts[role]=new THREE.MeshStandardMaterial({color:mat(role).color,transparent:true,opacity:0.12,depthWrite:false,side:THREE.DoubleSide}));}
function tick(force){
  const t=force===1?1:Math.min(1,(performance.now()-t0)/Math.max(dur,1));const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  for(const k in to){const p=from[k].p.clone().lerp(to[k].p,e),q=from[k].q.clone().slerp(to[k].q,e);const m=new THREE.Matrix4().compose(p,q,new THREE.Vector3(1,1,1));cur[k]=m;}
  applyAll();
  return t<1;
}
function setPalette(name){curPal=name;const P=S.palettes[name];
  for(const r in mats){const c=P[r]||(r==='disks'?'#3d6fb0':'#888888');mats[r].color.set(c);}
  for(const r in ghosts)ghosts[r].color.copy(mats[r].color);
  document.querySelectorAll('#pals button').forEach(b=>b.classList.toggle('on',b.dataset.k===name));}
const views={operating:[[-430,-760,470],[200,-40,90]],closed:[[-520,-560,430],[200,110,105]],rear:[[760,820,430],[200,125,95]],xray:[[-560,-520,520],[200,120,100]],front:[[200,-980,150],[200,0,108]],side:[[1400,123,115],[200,123,108]],side_op:[[1450,20,150],[200,20,100]],bay:[[980,470,470],[310,160,70]],top:[[200,-60,1250],[200,-60,0]]};
function setView(v){const c=views[v]||views.operating;camera.position.set(...c[0]);controls.target.set(...c[1]);controls.update();}
const SB=[['operating','Operating'],['closed','Closed / carry'],['rear','Rear + drawer'],['xray','X-ray']];
for(const [k,l] of SB){const b=document.createElement('button');b.textContent=l;b.dataset.k=k;b.onclick=()=>{setState(k);setView(k);};document.getElementById('states').append(b);}
for(const k in S.palettes){const b=document.createElement('button');b.textContent=S.palettes[k].label;b.dataset.k=k;b.onclick=()=>setPalette(k);document.getElementById('pals').append(b);}
const d=S.dims;document.getElementById('dims').innerHTML=`<b>Case</b> ${d.case_W_H_D_excl_feet.join(' × ')} mm (W×H×D, excl. feet) · <b>Closed</b> ${d.closed_W_H_D_incl_lid_feet_latches_excl_raised_handle.join(' × ')} mm<br><b>Keyboard unit</b> ${d.keyboard_unit_W_D_H.join(' × ')} mm · concept massing — hardware bodies are envelopes, keys illustrative.`;
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;
  const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(objs.filter(o=>!(xray&&o.material.transparent)),false)[0];
  document.getElementById('pick').innerHTML=hit?`<b>${hit.object.userData.name}</b>${hit.object.userData.note?' — '+hit.object.userData.note:''}`:'Click a part to identify it.';});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
window.__cam=(p,t)=>{camera.position.set(...p);controls.target.set(...t);controls.update();renderer.render(scene,camera);};
window.__setup=(state,pal,view)=>{setPalette(pal);setState(state,true);setView(view||state);controls.update();renderer.render(scene,camera);};
setPalette('charcoal');setState('operating',true);setView('operating');
window.__pause=false;
(function loop(){requestAnimationFrame(loop);if(window.__pause)return;if(dur)tick();controls.update();renderer.render(scene,camera);})();
(function wait(){if(screenReady){window.__ready=true;}else setTimeout(wait,50);})();
</script></body></html>
